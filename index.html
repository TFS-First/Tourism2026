const getDynamicFontSize = (text) => {
  const len = Array.from(text || '').length;
  if (len > 7) return 'text-lg md:text-xl';
  if (len > 4) return 'text-xl md:text-2xl';
  if (len > 2) return 'text-2xl md:text-3xl';
  return 'text-3xl md:text-4xl';
};

const DrawingPad = ({ sign, isExercise = false }) => {
  const canvasRef = useRef(null);
  const [isDrawing, setIsDrawing] = useState(false);

  const startDraw = (e) => {
    e.preventDefault();
    setIsDrawing(true);
    draw(e);
  };

  const endDraw = () => {
    setIsDrawing(false);
    const ctx = canvasRef.current?.getContext('2d');
    if (ctx) ctx.beginPath();
  };

  const draw = (e) => {
    if (!isDrawing) return;
    e.preventDefault();
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const rect = canvas.getBoundingClientRect();
    
    let clientX, clientY;
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }
    
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const x = (clientX - rect.left) * scaleX;
    const y = (clientY - rect.top) * scaleY;
    
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#1e293b';
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
  };

  const clearPad = () => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  };

  useEffect(() => {
    clearPad();
  }, [sign]);

  return (
    <div className={`flex flex-col items-center w-full bg-white p-4 md:p-6 rounded-2xl border border-stone-200 shadow-sm`}>
      {!isExercise && (
        <div className="flex items-center gap-2 mb-4 text-slate-700 font-bold md:text-lg">
          <Icon name="PenTool" size={20} className="text-amber-600" />
          <span>تدرب على الكتابة (ارسم فوق الحرف)</span>
        </div>
      )}
      
      <div 
        className={`relative w-full ${isExercise ? 'max-w-full h-40 md:h-44' : 'max-w-[280px] md:max-w-[320px] aspect-square'} bg-stone-50 border-2 border-dashed border-stone-300 rounded-xl overflow-hidden touch-none hover:border-amber-400 transition-colors`}
        style={{ touchAction: 'none' }}
      >
        {!isExercise && (
          <div className="absolute inset-0 flex items-center justify-center text-[160px] md:text-[180px] text-stone-200 pointer-events-none select-none font-['Segoe_UI_Historic'] pb-6">
            {sign}
          </div>
        )}
        <canvas
          ref={canvasRef}
          width={isExercise ? 450 : 320}
          height={isExercise ? 180 : 320}
          className="absolute inset-0 w-full h-full cursor-crosshair z-10"
          onMouseDown={startDraw} onMouseMove={draw} onMouseUp={endDraw} onMouseLeave={endDraw}
          onTouchStart={startDraw} onTouchMove={draw} onTouchEnd={endDraw}
        />
      </div>

      <button onClick={clearPad} className="mt-4 flex items-center gap-2 px-6 py-2.5 bg-stone-100 hover:bg-amber-50 hover:text-amber-800 text-stone-700 rounded-full transition-colors font-semibold text-sm">
        <Icon name="Eraser" size={16} /> مسح اللوحة
      </button>
    </div>
  );
};

const QuizSection = () => {
  const [isPlaying, setIsPlaying] = useState(false);
  const [currentQ, setCurrentQ] = useState(null);
  const [options, setOptions] = useState([]);
  const [score, setScore] = useState(0);
  const [rounds, setRounds] = useState(0);
  const [feedback, setFeedback] = useState(null);

  const startQuiz = () => {
    setScore(0); setRounds(0); setIsPlaying(true);
    generateQuestion();
  };

  const generateQuestion = () => {
    setFeedback(null);
    const correct = hieroglyphsData[Math.floor(Math.random() * hieroglyphsData.length)];
    let wrongOps = [];
    while (wrongOps.length < 3) {
      const wrong = hieroglyphsData[Math.floor(Math.random() * hieroglyphsData.length)];
      if (wrong.trans !== correct.trans && !wrongOps.find(o => o.trans === wrong.trans)) wrongOps.push(wrong);
    }
    setOptions([correct, ...wrongOps].sort(() => Math.random() - 0.5));
    setCurrentQ(correct);
  };

  useEffect(() => { if (isPlaying && !feedback && rounds > 0) generateQuestion(); }, [rounds]);

  const handleAnswer = (selected) => {
    if (feedback) return; 
    const isCorrect = selected.trans === currentQ.trans;
    setFeedback({ correct: isCorrect, correctTrans: currentQ.trans, selected: selected.trans });
    if (isCorrect) setScore(s => s + 1);
    setTimeout(() => { setRounds(r => r + 1); }, 1500);
  };

  if (!isPlaying) {
    return (
      <div className="max-w-lg mx-auto mt-10 p-6 md:p-10 bg-white rounded-2xl shadow-sm border border-stone-200 text-center">
        <div className="w-20 h-20 bg-amber-50 rounded-2xl flex items-center justify-center mx-auto mb-5 border border-amber-200">
          <Icon name="Gamepad2" size={44} className="text-amber-600" />
        </div>
        <h2 className="text-2xl md:text-3xl font-bold text-slate-800 mb-2">اختبار الأبجدية الهيروغليفية</h2>
        <p className="text-stone-500 mb-6 text-sm md:text-base">اختبر حفظك لرموز الأبجدية الصوتية (Uniliterals) وتعرف على نطقها الصحيح.</p>
        <button onClick={startQuiz} className="w-full py-3.5 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-bold text-lg transition-colors shadow-sm">ابدأ الاختبار الآن</button>
      </div>
    );
  }

  return (
    <div className="max-w-lg mx-auto mt-6 md:mt-10 p-6 md:p-8 bg-white rounded-2xl shadow-sm border border-stone-200 text-center">
      <div className="flex justify-between text-stone-500 font-bold mb-6 md:text-lg">
        <span>السؤال: {rounds + 1}</span><span className="text-amber-600">النتيجة: {score} / {rounds}</span>
      </div>
      <div className="bg-stone-50 w-36 h-36 md:w-44 md:h-44 mx-auto rounded-2xl flex items-center justify-center border border-stone-200 mb-8"><span className="text-7xl md:text-8xl text-slate-800 font-['Segoe_UI_Historic']">{currentQ?.h}</span></div>
      <div className="grid grid-cols-2 gap-3 md:gap-4 mb-6" dir="ltr">
        {options.map((opt, i) => {
          let btnClass = "py-4 md:py-5 text-2xl md:text-3xl font-serif rounded-xl border-2 transition-all ";
          if (!feedback) btnClass += "border-stone-200 bg-white hover:border-amber-400 hover:bg-amber-50/30 text-slate-700";
          else if (opt.trans === currentQ.trans) btnClass += "border-green-500 bg-green-50 text-green-700"; 
          else if (!feedback.correct && feedback.selected === opt.trans) btnClass += "border-red-500 bg-red-50 text-red-700"; 
          else btnClass += "border-stone-200 bg-stone-50 text-stone-400 opacity-50";
          return <button key={i} onClick={() => handleAnswer(opt)} className={btnClass} disabled={!!feedback}>{opt.trans}</button>;
        })}
      </div>
      {feedback && (
        <div className={`flex items-center justify-center gap-2 font-bold md:text-lg ${feedback.correct ? 'text-green-600' : 'text-red-600'}`}>
          <Icon name={feedback.correct ? "CheckCircle2" : "XCircle"} size={22} /> <span>{feedback.correct ? 'صحيح!' : `خطأ! الإجابة: ${feedback.correctTrans}`}</span>
        </div>
      )}
      <button onClick={() => setIsPlaying(false)} className="mt-8 text-stone-400 hover:text-stone-600 font-medium transition-colors">إنهاء الاختبار</button>
    </div>
  );
};

                  <h4 className="text-amber-800 md:text-lg font-bold mb-4 flex items-center justify-center gap-2 border-b border-amber-200 pb-3">
                    <Icon name="BookOpen" size={20} /> أمثلة تطبيقية
                  </h4>
                  {/* Examples: Left = Hieroglyph Word -> Right = Transliteration & Meaning */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 xl:grid-cols-2 gap-3" dir="ltr">
                    {selectedSign.examples.map((ex, i) => (
                      <div key={i} className="bg-white p-4 rounded-xl border border-stone-200 shadow-sm flex items-center justify-between gap-4 hover:border-amber-300 transition-all" dir="ltr">
                        {/* 1. Left: Hieroglyph Word */}
                        <div className="w-1/2 text-left flex items-center justify-start">
                          <span className={`${getDynamicFontSize(ex.word)} text-slate-800 font-['Segoe_UI_Historic'] break-all`}>{ex.word}</span>
                        </div>
                        {/* 2. Right: Transliteration & Meaning */}
                        <div className="flex flex-col items-start border-l-2 border-stone-100 pl-4 w-1/2 text-left" dir="ltr">
                          <span className="text-2xl font-serif text-amber-700 font-bold leading-none mb-2">{ex.trans}</span>
                          <span className="text-sm font-medium text-slate-600">{ex.mean}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>

            {/* Left Column on Desktop: Sticky Drawing Pad */}
            <div className="lg:col-span-5 lg:sticky lg:top-24">
              <DrawingPad sign={selectedSign.h} />
            </div>
          </main>
        </div>
      )}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  render() {
    if (this.state.hasError) {
      return (
        <div className="min-h-screen flex items-center justify-center bg-stone-100 p-4">
          <div className="bg-red-50 border border-red-200 rounded-2xl p-6 text-left max-w-lg w-full" dir="ltr">
            <h2 className="text-xl font-bold text-red-700 mb-4">Something went wrong!</h2>
            <p className="text-sm text-red-600 bg-red-100 p-3 rounded-lg font-mono overflow-auto">{this.state.error?.toString()}</p>
            <p className="mt-4 text-stone-600 text-sm">أرجو إرسال هذه الرسالة لي لإصلاح العطل.</p>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function App() {
  return (
    <ErrorBoundary>
      <MainApp />
    </ErrorBoundary>
  );
}


const rootElement = document.getElementById('root');
const root = ReactDOM.createRoot(rootElement);
root.render(<App />);
  </script>
</body>
